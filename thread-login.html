<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Thread</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f7f3;color:#27382d;font:15px Arial,sans-serif}header{height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 6%;border-bottom:1px solid #e1e1d8}header b{font:28px Georgia;letter-spacing:-1px}header span{font-size:12px;color:#7b8279}main{max-width:860px;margin:auto;padding:36px 24px 150px}.welcome{display:grid;grid-template-columns:1fr 210px;align-items:center;padding:25px 0 38px;gap:45px}.welcome img{width:210px;height:230px;border-radius:110px 110px 6px 6px;object-fit:cover}.eyebrow{text-transform:uppercase;font-size:10px;letter-spacing:2.5px;color:#818975}h1{font:48px/1.1 Georgia;font-weight:normal;margin:16px 0}p{line-height:1.6}.msg{margin:24px 0;max-width:100%;white-space:pre-wrap;line-height:1.65}.user{margin-left:auto;max-width:75%;background:#e8ece3;padding:14px 20px;border-radius:18px 18px 3px 18px}.assistant{padding-left:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:18px 0}.card{background:white;border-radius:10px;overflow:hidden;border:1px solid #e8e7df}.card img{width:100%;height:250px;object-fit:contain;background:#eeede7}.card div{padding:15px}.card h3{font:18px Georgia;margin:5px 0}.card p{font-size:11px;color:#788076;margin:8px 0}.card .explanation{font-size:12px;color:#344a3d;line-height:1.6}.card small{font-size:10px;letter-spacing:2px}.compose{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#f8f7f3 20%);padding:25px 24px 24px}.compose form{max-width:812px;margin:auto;background:white;border:1px solid #d6dcd1;box-shadow:0 10px 35px #1e392414;border-radius:18px;display:flex;padding:10px;align-items:center}.compose input{flex:1;min-width:0;border:0;outline:none;background:none;padding:14px;font:15px Arial}.compose button{border:0;border-radius:12px;background:#2d4c3a;color:white;width:44px;height:44px;font-size:24px;cursor:pointer}.hint{max-width:812px;margin:10px auto 0;text-align:center;font-size:10px;color:#7f887b}.signin{border:1px solid #cbd5c6;border-radius:8px;background:#2d4c3a;color:white;padding:12px 20px;cursor:pointer}.status{font-size:12px;color:#7a8275}details{font-size:12px;margin-top:28px;color:#7b8279}pre{white-space:pre-wrap;background:#ecefe8;padding:15px;max-height:280px;overflow:auto;font-size:11px}a{color:inherit;text-decoration:none}@media(max-width:600px){.welcome{grid-template-columns:1fr 110px;gap:15px}.welcome img{width:110px;height:160px}h1{font-size:34px}.cards{grid-template-columns:1fr}.card{display:flex}.card img{width:40%;height:180px}.card div{width:60%}.compose{padding:20px 12px 15px}header{padding:0 24px}.welcome p{font-size:13px}}.account-tools{display:flex;align-items:center;gap:16px}.account-tools button,.quiet{border:0;background:none;color:#61715e;cursor:pointer;font:12px Arial;padding:8px 0}dialog{max-width:480px;width:calc(100% - 32px);border:1px solid #d6dcd1;border-radius:18px;padding:28px;color:#27382d;background:#f8f7f3}dialog::backdrop{background:#20312666}dialog h2{font:28px Georgia}dialog button{padding:12px 18px;border:1px solid #cbd5c6;border-radius:9px;background:white;color:#27382d;cursor:pointer}dialog button.primary{background:#2d4c3a;color:white}.dialog-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}#archive-content{max-height:55vh;overflow:auto;white-space:pre-wrap;line-height:1.6}#archive-list button{display:block;width:100%;margin:10px 0;text-align:left}@media(max-width:600px){header{height:auto;min-height:88px;gap:12px;padding:18px 20px}.account-tools{flex-wrap:wrap;justify-content:flex-end;gap:8px 12px}.account-tools span{width:100%;text-align:right}.account-tools button{font-size:11px}}
main{max-width:480px;padding-top:70px}.login label{display:block;margin:22px 0 7px;font-size:12px}.login input{width:100%;padding:15px;border:1px solid #d6dcd1;border-radius:9px;background:white;font:15px Arial}.login button{width:100%;margin-top:26px;padding:15px;border:0;border-radius:10px;background:#2d4c3a;color:white;font-size:14px}.error{color:#9b403c;font-size:13px}.login-note{font-size:11px;color:#7b8279}</style></head><body><header><b>thread<span style="color:#9eac87;font-size:25px"> ✳</span></b><span>Your personal stylist</span></header><main><p class="eyebrow">YOUR STYLE, REMEMBERED</p><h1>Welcome to<br>your wardrobe.</h1><p>Sign in for a conversation that’s yours.</p><form class="login" id="thread-login" method="post"><input type="hidden" name="csrf" value="{{csrf}}"><p class="error" role="alert">{{error}}</p><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="customer001@thread.local" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button>Sign in to Thread</button></form><p class="login-note">Demo accounts: customer001–customer100@thread.local<br>Shared demo password: wardrobe</p><p class="login-note">FORME sign-in and shopping approval happen separately.</p></main></body></html>
