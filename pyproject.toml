[project]
name = "thread3"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["deepagents==0.7.24", "langgraph==1.2.14", "langchain==1.4.4", "langchain-openai==1.7.0", "datalayer-reactor==1.3.0", "PyJWT==2.15.1", "starlette==1.7.0", "httpx==0.28.1", "uvicorn==0.54.0", "python-dotenv==1.2.4"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
norecursedirs = ["vendor", ".venv", "audit", "evidence"]
